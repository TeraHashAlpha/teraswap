# [CHORE-TOKEN-CATALOG-PIPELINE / fix/token-sync-cron-landing] Scheduled token-catalog
# regeneration — ONE CHAIN PER JOB (matrix), so a chain that fails the gate can never block
# the others from shipping their own PR, and a failure never disappears silently.
#
# Runs `npm run tokens:sync` scoped to one chain (TOKENS_SYNC_CHAINS), gates the result with
# the SAME no-network guards CI runs, and opens a PR for that chain when its catalog or its
# slice of the guard trust fixture changed. Nothing lands on main without review + CI.
#
# The chain matrix itself is NOT a second hand-maintained list: the `chains` job reads it
# straight from the chain registry (scripts/token-catalog/list-chains.ts →
# src/lib/chains/registry.ts getSupportedChainIds()) — the SAME source GUARD_CHAINS
# (scripts/token-catalog/lib/verdicts.ts) and PIPELINE_CONFIG.chains derive from, and the
# same one catalog-address-guard.test.ts's own registry-drift assertion checks against. Add a
# chain to the registry and this workflow picks it up next run, no YAML edit needed.
#
# NOTE: scheduled workflows only run from the DEFAULT branch — this activates once
# merged to main. Triggers are schedule/workflow_dispatch only (no untrusted input
# is ever interpolated into run: commands).
#
# The PR branch commit is created by github-actions[bot] (unsigned): main's
# signed-commit protection applies to MERGE commits — merge via the GitHub UI
# (squash), which produces a GitHub web-flow-signed commit.
#
# PR token [chore/catalog-workflow-pr-token-and-ordering]:
#  - Events created with the built-in GITHUB_TOKEN do NOT trigger other workflows, so a
#    PR it opens never runs ci.yml (PRs #547/#548/#549 sat BLOCKED at 2/2 checks until
#    closed/reopened by hand). `gh pr create` therefore runs with the CATALOG_PR_TOKEN
#    repo secret (fine-grained PAT, this repo only, Pull requests: write + Contents:
#    read) — the ONLY call that uses it. Branch push, createCommitOnBranch, closing
#    superseded PRs and the failure alert all stay on GITHUB_TOKEN.
#  - CATALOG_PR_TOKEN empty/missing, or rejected (expired): falls back to GITHUB_TOKEN
#    with a ::warning:: — the PR still opens but CI will NOT run on it; close/reopen it
#    by hand. The fallback needs the repo setting "Allow GitHub Actions to create and
#    approve pull requests".
#
# Auto-merge [feat/catalog-auto-merge] — owner's scoped exception to "owner merges every PR":
#  - After the PR exists, scripts/token-catalog/auto-merge-eligibility.mjs checks nine
#    conditions (guard PASS, data-files-only diff, 0 removals, <=10 additions + size bound,
#    no single-source rows on mainnet, valid added rows, workflow identity, ...). ALL pass →
#    `gh pr merge --auto --squash` (GitHub waits for the branch-protection required checks;
#    nothing is bypassed). Otherwise → label `catalog-review` + a checklist comment.
#  - Needs the repo setting Settings → General → "Allow auto-merge" (OFF today → the step
#    degrades to the review path with an explanatory comment, never fails the run).
#  - Pause: set repo variable CATALOG_AUTO_MERGE=off (Settings → Variables → Actions).
#    Runbook: docs/Runbooks/CATALOG-AUTO-MERGE.md.

name: "Token catalog refresh"

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: {}

# Least privilege [feat/catalog-auto-merge]: read-only by default; the one job that pushes the
# branch, opens/labels/merges PRs and files the failure alert (refresh) declares its own scopes.
permissions:
  contents: read

concurrency:
  group: token-catalog-refresh
  cancel-in-progress: false

jobs:
  chains:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - id: list
        run: echo "matrix=$(npx tsx --tsconfig tsconfig.json scripts/token-catalog/list-chains.ts)" >> "$GITHUB_OUTPUT"

  refresh:
    needs: chains
    permissions:
      contents: write # push the refresh branch, createCommitOnBranch, delete superseded branches
      pull-requests: write # open/close PRs, label + comment, enable auto-merge
      issues: write # failure-alert issue (gh issue create/comment)
    strategy:
      fail-fast: false # one chain's failure must never cancel the others' jobs
      matrix:
        chain: ${{ fromJson(needs.chains.outputs.matrix) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci

      - name: Rebuild token catalog (chain ${{ matrix.chain }})
        id: build
        # The GUARD_RPC_* secrets are OPTIONAL overrides. They are exported only when
        # non-empty: an undefined secret expands to "" and would otherwise DEFINE the env
        # var as empty — verdicts.ts uses `??`, which does not replace "", so the publicnode
        # default would be defeated and the run would fail on an empty RPC URL.
        env:
          GUARD_RPC_1_OVERRIDE: ${{ secrets.GUARD_RPC_1 }}
          GUARD_RPC_8453_OVERRIDE: ${{ secrets.GUARD_RPC_8453 }}
          GUARD_RPC_42161_OVERRIDE: ${{ secrets.GUARD_RPC_42161 }}
          TOKENS_SYNC_CHAINS: ${{ matrix.chain }}
        run: |
          if [ -n "$GUARD_RPC_1_OVERRIDE" ]; then export GUARD_RPC_1="$GUARD_RPC_1_OVERRIDE"; fi
          if [ -n "$GUARD_RPC_8453_OVERRIDE" ]; then export GUARD_RPC_8453="$GUARD_RPC_8453_OVERRIDE"; fi
          if [ -n "$GUARD_RPC_42161_OVERRIDE" ]; then export GUARD_RPC_42161="$GUARD_RPC_42161_OVERRIDE"; fi
          npm run tokens:sync

      - name: Gate the regenerated catalog (same no-network guards as CI)
        id: gate
        run: |
          set -o pipefail
          npx vitest run src/lib/chains/catalog-address-guard.test.ts src/lib/chains/token-catalog-json.test.ts src/lib/chains/token-catalog.test.ts 2>&1 | tee gate-output.log

      - name: Report per-chain counts (added/removed/changed)
        if: always()
        id: diff
        run: |
          # [chore/catalog-workflow-pr-token-and-ordering] The same table also goes to the job log
          # via tee — it used to land only in $GITHUB_OUTPUT, so the log showed nothing. pipefail:
          # tee's own exit 0 must never mask a report-diff.ts failure.
          set -o pipefail
          REPORT_FILE=$(mktemp)
          npx tsx --tsconfig tsconfig.json scripts/token-catalog/report-diff.ts ${{ matrix.chain }} | tee "$REPORT_FILE"
          {
            echo 'summary<<GATE_DIFF_EOF'
            cat "$REPORT_FILE"
            echo 'GATE_DIFF_EOF'
          } >> "$GITHUB_OUTPUT"

      # [chore/catalog-workflow-pr-token-and-ordering] One step per remote side effect, in this
      # order: push branch + verified commit → open the new PR → ONLY THEN close the superseded
      # ones. Closing first (the old order) left the chain with NO open PR whenever a later call
      # failed. Each step runs only if every earlier one succeeded (implicit success()).
      - name: Push the refresh branch + verified commit (chain ${{ matrix.chain }})
        if: steps.gate.outcome == 'success'
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          CHAIN: ${{ matrix.chain }}
        run: |
          FILE="src/config/generated/token-catalog.${CHAIN}.json"
          TRUST_FILE="src/lib/chains/catalog-guard.trust.json"
          if git diff --quiet -- "$FILE" "$TRUST_FILE"; then
            echo "chain ${CHAIN}: catalog unchanged — nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TODAY="$(date -u +%Y-%m-%d)"
          # [chore/catalog-workflow-verified-commits-and-alerts] run-id suffix: two runs on the
          # same UTC day for the same chain (a retry, or workflow_dispatch next to the cron) must
          # never collide on the same branch name — a fresh unique name needs no force-push.
          BRANCH="chore/token-catalog-refresh-${CHAIN}-${TODAY}-${{ github.run_id }}"

          # [chore/catalog-workflow-verified-commits-and-alerts] Verified commit, no signing key:
          # main requires every commit to carry a verified signature, but this job's GITHUB_TOKEN
          # holds no signing key, so a plain `git commit` here can never be Verified — every prior
          # catalog PR (#505/#516/#517) was blocked on main and had to be rebase-resigned by hand.
          # GitHub's own GraphQL `createCommitOnBranch` authors + signs the commit itself, using
          # only the existing GITHUB_TOKEN. The branch is created first, at the CURRENT main tip
          # (no new commit yet — `git rev-parse HEAD` is still the checkout's base commit; the
          # earlier tokens:sync step only modified the working tree, nothing has been committed),
          # then that one call both creates the commit and advances the branch to it.
          EXPECTED_HEAD_OID="$(git rev-parse HEAD)"

          # shellcheck disable=SC2016 # literal GraphQL variable syntax, not a shell expansion
          QUERY='mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid url } } }'
          # [fix/catalog-workflow-jq-arg-too-long] File contents NEVER go through argv: Linux caps a
          # single argv string at MAX_ARG_STRLEN (128 KiB), and `--arg contents "$(base64 …)"` died
          # with `jq: Argument list too long` (exit 126) on every chain in run 37505341116. The base64
          # goes to temp files that jq reads itself (--rawfile). The payload is the FULL request body
          # ({query, variables}) sent via --input: `-F input=@file` sends the file as a JSON STRING
          # (measured, gh 2.96), never the CreateCommitOnBranchInput object the mutation needs.
          CONTENTS1_FILE=$(mktemp)
          CONTENTS2_FILE=$(mktemp)
          base64 -w0 "$FILE" > "$CONTENTS1_FILE"
          base64 -w0 "$TRUST_FILE" > "$CONTENTS2_FILE"
          PAYLOAD_FILE=$(mktemp)
          jq -n \
            --arg query "$QUERY" \
            --arg repo "${{ github.repository }}" \
            --arg branch "$BRANCH" \
            --arg headline "chore(catalog): scheduled tokens:sync refresh — chain ${CHAIN}" \
            --arg oid "$EXPECTED_HEAD_OID" \
            --arg path1 "$FILE" \
            --rawfile contents1 "$CONTENTS1_FILE" \
            --arg path2 "$TRUST_FILE" \
            --rawfile contents2 "$CONTENTS2_FILE" \
            '{
              query: $query,
              variables: { input: {
                branch: { repositoryNameWithOwner: $repo, branchName: $branch },
                message: { headline: $headline },
                fileChanges: { additions: [ { path: $path1, contents: $contents1 }, { path: $path2, contents: $contents2 } ] },
                expectedHeadOid: $oid
              } }
            }' > "$PAYLOAD_FILE"
          # [fix/catalog-workflow-jq-arg-too-long] Fail loudly (never a silent skip) BEFORE any remote
          # side effect: an empty encoded file would commit an empty catalog. The branch is pushed only
          # after this check, so a bad payload no longer leaves an orphan branch behind.
          if [ ! -s "$CONTENTS1_FILE" ] || [ ! -s "$CONTENTS2_FILE" ]; then echo "::error::chain ${CHAIN}: encoded payload is empty (size 0) for ${FILE} or ${TRUST_FILE} — refusing to push the branch or call createCommitOnBranch"; exit 1; fi
          git push origin "HEAD:refs/heads/${BRANCH}"
          gh api graphql --input "$PAYLOAD_FILE"
          {
            echo "changed=true"
            echo "branch=${BRANCH}"
          } >> "$GITHUB_OUTPUT"

      - name: Open a PR when this chain's catalog changed
        if: steps.commit.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          # Step-level on purpose: used ONLY as GH_TOKEN for `gh pr create` below, never echoed.
          CATALOG_PR_TOKEN: ${{ secrets.CATALOG_PR_TOKEN }}
          CHAIN: ${{ matrix.chain }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Piped through an env var, never spliced into the script text: the summary embeds
          # token symbols sourced from external token lists (attacker-choosable strings) — a
          # symbol like `"; curl evil #` interpolated via ${{ }} would run as shell code.
          DIFF_SUMMARY: ${{ steps.diff.outputs.summary }}
        run: |
          # [chore/catalog-workflow-verified-commits-and-alerts] One line, sourced from the same
          # env-provided DIFF_SUMMARY/RUN_URL as above, not re-templated from the job context —
          # states the gate result explicitly instead of leaving a reviewer to infer PASS from
          # "a PR exists" (this step only runs on steps.gate.outcome == 'success').
          COUNTS_LINE="$(printf '%s\n' "$DIFF_SUMMARY" | head -n1)"
          BODY_FILE=$(mktemp)
          {
            echo "Automated \`npm run tokens:sync\` refresh for chain **${CHAIN}** (cross-verified multi-source catalog + guard trust fixture). Gated by catalog-address-guard + catalog JSON invariants before this PR was opened. See docs/Prompts/CHORE-TOKEN-CATALOG-PIPELINE.md."
            echo ""
            echo "Guard: PASS (catalog-address-guard + no-network gates) — run ${RUN_URL} — ${COUNTS_LINE}"
            echo ""
            echo "### Counts"
            echo '```'
            printf '%s\n' "$DIFF_SUMMARY"
            echo '```'
          } > "$BODY_FILE"
          # [chore/catalog-workflow-pr-token-and-ordering] Opened with the PAT so the PR's
          # `pull_request` event triggers CI. Empty secret, or the PAT rejected (expired): fall
          # back to GITHUB_TOKEN with a warning — the PR still opens, the token never fails the run.
          PR_ARGS=(--title "chore(catalog): scheduled token-catalog refresh — chain ${CHAIN}" --body-file "$BODY_FILE" --base main --head "$BRANCH")
          PR_TOKEN_WARNING="::warning::CATALOG_PR_TOKEN missing or expired — PR will not trigger CI; close/reopen it manually"
          OPENED_WITH=pat
          if [ -z "$CATALOG_PR_TOKEN" ]; then
            echo "$PR_TOKEN_WARNING"
            PR_URL="$(gh pr create "${PR_ARGS[@]}")"
            OPENED_WITH=fallback
          elif ! PR_URL="$(GH_TOKEN="$CATALOG_PR_TOKEN" gh pr create "${PR_ARGS[@]}")"; then
            echo "$PR_TOKEN_WARNING"
            PR_URL="$(gh pr create "${PR_ARGS[@]}")"
            OPENED_WITH=fallback
          fi
          echo "chain ${CHAIN}: opened ${PR_URL}"
          # [feat/catalog-auto-merge] The workflow's PR identity = the PAT's owner (its PRs are NOT
          # authored by a bot) and CI only starts on a PAT-opened PR. Login is public, never a secret.
          PR_AUTHOR="github-actions[bot]"
          CI_TRIGGERED=false
          if [ "$OPENED_WITH" = pat ]; then
            CI_TRIGGERED=true
            PR_AUTHOR="$(GH_TOKEN="$CATALOG_PR_TOKEN" gh api user --jq .login 2>/dev/null || true)"
          fi
          {
            echo "url=${PR_URL}"
            echo "author=${PR_AUTHOR}"
            echo "ci_triggered=${CI_TRIGGERED}"
          } >> "$GITHUB_OUTPUT"

      - name: Close superseded refresh PRs for this chain (after the new PR exists)
        if: steps.pr.outcome == 'success'
        id: supersede
        env:
          GH_TOKEN: ${{ github.token }}
          CHAIN: ${{ matrix.chain }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          # [fix/catalog-trust-loss-means-previously-verified] one open catalog PR per chain: a
          # missed/failed merge otherwise leaves last week's refresh PR open next to this run's, and
          # the two can conflict or ship stale counts. Close every OTHER open PR whose head matches
          # this chain's prefix (the one just opened, head == $BRANCH, is skipped) and delete its
          # branch too — regenerable bot branches carrying no human work, so nothing is lost.
          # pipefail: a failed `gh pr list` must fail the step (→ alert), not feed an empty loop.
          set -o pipefail
          PREFIX="chore/token-catalog-refresh-${CHAIN}-"
          gh pr list --repo "${{ github.repository }}" --state open --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"${PREFIX}\")) | select(.headRefName != \"${BRANCH}\") | [.number, .headRefName] | @tsv" |
            while IFS=$'\t' read -r SUPERSEDED_NUM SUPERSEDED_BRANCH; do
              echo "closing superseded PR #${SUPERSEDED_NUM} for chain ${CHAIN} (deleting branch ${SUPERSEDED_BRANCH})"
              gh pr close "$SUPERSEDED_NUM" --repo "${{ github.repository }}" \
                --comment "Superseded by ${PR_URL} (refresh for chain ${CHAIN})"
              git push origin --delete "$SUPERSEDED_BRANCH" || true
            done

      # [feat/catalog-auto-merge] Runs only after the PR exists AND its superseded siblings are closed.
      # Pause switch: repo variable CATALOG_AUTO_MERGE=off skips this whole step (PR stays plain).
      - name: Auto-merge when eligible, else label for review (chain ${{ matrix.chain }})
        if: steps.supersede.outcome == 'success' && vars.CATALOG_AUTO_MERGE != 'off'
        id: automerge
        env:
          GH_TOKEN: ${{ github.token }} # NOT the PAT: the PAT is used for `gh pr create` only
          REPO: ${{ github.repository }}
          CHAIN: ${{ matrix.chain }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          PR_URL: ${{ steps.pr.outputs.url }}
          EXPECTED_AUTHOR: ${{ steps.pr.outputs.author }}
          CI_TRIGGERED: ${{ steps.pr.outputs.ci_triggered }}
          GUARD_OUTCOME: ${{ steps.gate.outcome }}
          RUN_ID: ${{ github.run_id }}
        run: |
          MARKER='<!-- catalog-auto-merge -->'
          PR_NUM="${PR_URL##*/}"
          git fetch --no-tags --depth=2 origin "refs/heads/${BRANCH}"
          HEAD_SHA="$(git rev-parse FETCH_HEAD)"
          PR_AUTHOR="$(gh pr view "$PR_URL" --repo "$REPO" --json author --jq .author.login)"
          RESULT_FILE=$(mktemp)
          CHECKLIST_FILE=$(mktemp)
          # Base = this job's checkout (the exact commit the refresh branch was created on).
          if ! node scripts/token-catalog/auto-merge-eligibility.mjs \
            --base "$(git rev-parse HEAD)" --head "$HEAD_SHA" --head-ref "$BRANCH" \
            --guard "$GUARD_OUTCOME" --pr-author "$PR_AUTHOR" --expected-author "$EXPECTED_AUTHOR" \
            --ci-triggered "$CI_TRIGGERED" --run-id "$RUN_ID" \
            --checklist-file "$CHECKLIST_FILE" > "$RESULT_FILE"; then
            echo "eligible=false" > "$RESULT_FILE"
            echo '**Catalog auto-merge: NOT eligible** — the eligibility script crashed (fail-closed). See the run log.' > "$CHECKLIST_FILE"
          fi
          cat "$RESULT_FILE"
          # First line only: reasons are sanitised in the script, but the verdict never depends on later lines.
          ELIGIBLE=false
          if [ "$(head -n1 "$RESULT_FILE")" = "eligible=true" ]; then ELIGIBLE=true; fi

          if [ "$ELIGIBLE" = true ]; then
            # --match-head-commit: only merge the exact commit that was just checked.
            if MERGE_ERR="$(gh pr merge "$PR_URL" --repo "$REPO" --auto --squash --match-head-commit "$HEAD_SHA" 2>&1)"; then
              echo "chain ${CHAIN}: auto-merge enabled on ${PR_URL} (squash, waits for required checks)"
              printf '\nAuto-merge enabled (squash) — GitHub merges once every required check is green.\n' >> "$CHECKLIST_FILE"
            else
              ELIGIBLE=false
              # gh's error text, first line only, reduced to a safe charset before it reaches a log command or a comment.
              ERR_LINE="$(printf '%s' "${MERGE_ERR%%$'\n'*}" | tr -cd '[:alnum:] .,:;()/_-')"
              echo "::warning::chain ${CHAIN}: eligible, but enabling auto-merge failed — is Settings → General → 'Allow auto-merge' on? (${ERR_LINE})"
              # shellcheck disable=SC2016 # backticks are literal markdown in the comment, not a command substitution
              printf '\n> Eligible, but GitHub refused to enable auto-merge: `%s`. Likely the repo setting "Allow auto-merge" is off — merge by hand.\n' "$ERR_LINE" >> "$CHECKLIST_FILE"
            fi
          fi
          if [ "$ELIGIBLE" != true ]; then
            echo "chain ${CHAIN}: NOT auto-merging ${PR_URL} — labelling catalog-review"
            gh label create catalog-review --repo "$REPO" --color FBCA04 \
              --description "Catalog refresh PR needs human review (auto-merge ineligible)" 2>/dev/null || true
            gh pr edit "$PR_URL" --repo "$REPO" --add-label catalog-review
          fi

          # One checklist comment per PR, updated in place on re-runs (idempotent).
          { echo "$MARKER"; cat "$CHECKLIST_FILE"; } > "${CHECKLIST_FILE}.body"
          EXISTING="$(gh api "repos/${REPO}/issues/${PR_NUM}/comments" --paginate --jq ".[] | select(.body | startswith(\"${MARKER}\")) | .id" | sed -n '1p')"
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${EXISTING}" -F body=@"${CHECKLIST_FILE}.body" > /dev/null
          else
            gh api "repos/${REPO}/issues/${PR_NUM}/comments" -F body=@"${CHECKLIST_FILE}.body" > /dev/null
          fi

      - name: Loud failure alert — never a silent skip (chain ${{ matrix.chain }})
        # [chore/catalog-workflow-verified-commits-and-alerts] was `failure() &&
        # steps.gate.outcome == 'failure'` — if the REBUILD step throws (the most likely
        # failure), `gate` never runs, so its outcome is 'skipped', not 'failure', and no issue
        # ever opened. `failure()` alone catches a failed build, gate, or diff step.
        # [chore/catalog-workflow-pr-token-and-ordering] Kept as the job's LAST step so
        # `failure()` also covers push/PR/supersede — run 37505341116 failed in the PR step,
        # which ran AFTER this alert, so nothing fired.
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          DIFF_OUTCOME: ${{ steps.diff.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          PR_OUTCOME: ${{ steps.pr.outcome }}
          SUPERSEDE_OUTCOME: ${{ steps.supersede.outcome }}
          AUTOMERGE_OUTCOME: ${{ steps.automerge.outcome }}
        run: |
          # First offending line from the guard's own output — [fatal] rows name the guard
          # check + address directly; an AssertionError (e.g. the mainnet size guard) is the
          # next best signal. Falls back to a generic marker so the alert is NEVER empty.
          # gate-output.log may not exist at all (build failed before the gate ran) — grep's
          # own nonzero exit on a missing file still falls through the || chain.
          FIRST_ISSUE=$(grep -m1 -E '^\s*\[fatal\]' gate-output.log 2>/dev/null || grep -m1 'AssertionError' gate-output.log 2>/dev/null || echo 'see attached gate log for detail')
          FAILED_STEP="unknown step"
          if [ "$BUILD_OUTCOME" = "failure" ]; then
            FAILED_STEP="build (Rebuild token catalog)"
          elif [ "$GATE_OUTCOME" = "failure" ]; then
            FAILED_STEP="gate (no-network guard tests)"
          elif [ "$DIFF_OUTCOME" = "failure" ]; then
            FAILED_STEP="diff (report-diff.ts)"
          elif [ "$COMMIT_OUTCOME" = "failure" ]; then
            FAILED_STEP="commit (push branch + createCommitOnBranch)"
          elif [ "$PR_OUTCOME" = "failure" ]; then
            FAILED_STEP="pr (gh pr create)"
          elif [ "$SUPERSEDE_OUTCOME" = "failure" ]; then
            FAILED_STEP="supersede (close superseded PRs)"
          elif [ "$AUTOMERGE_OUTCOME" = "failure" ]; then
            FAILED_STEP="automerge (eligibility + auto-merge/label)"
          fi
          TITLE="[token-catalog-guard] chain ${{ matrix.chain }} refresh failed"
          BODY_FILE=$(mktemp)
          {
            echo "The token-catalog-refresh cron FAILED for **chain ${{ matrix.chain }}** on \`$(date -u +%Y-%m-%d)\` — failed step: **${FAILED_STEP}**."
            echo ""
            echo "First offending finding:"
            echo '```'
            echo "$FIRST_ISSUE"
            echo '```'
            echo ""
            echo "Full gate output (last 200 lines, if the gate step ran):"
            echo '```'
            tail -n 200 gate-output.log 2>/dev/null || echo '(gate step did not run — the build step failed first)'
            echo '```'
            echo ""
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > "$BODY_FILE"

          EXISTING=$(gh issue list --search "in:title \"$TITLE\" is:open" --json number --jq '.[0].number' --repo "${{ github.repository }}" || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body-file "$BODY_FILE"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body-file "$BODY_FILE"
          fi
          echo "::error::token-catalog-refresh FAILED for chain ${{ matrix.chain }} at step ${FAILED_STEP}: $FIRST_ISSUE"
