# CI pipeline — parallel jobs: lint, typecheck, audit, contract tests
# Build runs after lint + typecheck + audit + lockfile-lint pass.
# Contract tests run independently (Foundry/Forge).
#
# ── SECURITY NOTE (M-01) ─────────────────────────────────────────────
# We run `npm ci --ignore-scripts=false` intentionally because our
# postinstall hook runs `prisma generate` (required for the build).
# This means npm lifecycle scripts ARE executed during CI installs.
#
# Mitigations:
#   1. lockfile-lint job validates that all resolved URLs point to the
#      official npm registry over HTTPS and that integrity hashes match.
#   2. Dependabot keeps dependencies up-to-date, reducing the window
#      for supply-chain attacks via compromised transitive packages.
#   3. npm audit (high/critical gate) catches known-vulnerable packages.
#   4. .npmrc min-release-age=7d refuses packages published < 7 days,
#      blocking zero-day supply chain attacks (e.g. Mini Shai-Hulud).
#
# If you remove the prisma dependency, switch back to plain `npm ci`
# (which defaults to --ignore-scripts=true in CI).
# ─────────────────────────────────────────────────────────────────────

name: "CI"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --ignore-scripts=false
      - name: Lint (warnings only — React Compiler rules are advisory)
        run: npx next lint --max-warnings 200 || true

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --ignore-scripts=false
      - run: npm run typecheck
      # [INC-2026-05-31-001] Fail on any NEW circular import — a cycle can yield
      # undefined exports in the Next prod bundle that unit tests don't catch.
      - name: Circular-import guard
        run: npm run check:circular

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --ignore-scripts=false
      - name: Security audit (high/critical, allowlist-aware)
        # Fails on any high/critical NOT in audit-allowlist.json. The allowlist holds
        # only fixes blocked by .npmrc min-release-age=7 (each with a dated TODO). See
        # scripts/audit-gate.mjs + audit-allowlist.json.
        run: node scripts/audit-gate.mjs

  catalog-address-guard:
    # [CHORE-CATALOG-ADDRESS-GUARD] Deterministic gate over the curated token catalog
    # (src/lib/tokens.ts + src/lib/chains/tokens.ts, chains 1 + 8453). Every token must
    # have on-chain bytecode (no dead addresses like the W/USDe/weETH removed this sprint),
    # be present in a bundled reputable token list (or be allowlisted), and have a unique
    # symbol per chain (no legacy+current duplicates like MORPHO). Reads a committed verdict
    # cache (src/lib/chains/catalog-guard.trust.json) refreshed by scripts/refresh-catalog-guard.ts
    # — NO network at gate time, so it is reproducible and never flaky.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --ignore-scripts=false
      - name: Catalog address guard
        run: npx vitest run src/lib/chains/catalog-address-guard.test.ts

  lockfile-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"
      - name: Validate lockfile integrity
        run: npx lockfile-lint@4 --path package-lock.json --type npm --allowed-hosts npm --validate-https --validate-integrity
      - name: Verify .npmrc hardening
        run: |
          grep -q 'min-release-age' .npmrc || (echo "ERROR: .npmrc missing min-release-age" && exit 1)
          grep -q 'registry=https://registry.npmjs.org/' .npmrc || (echo "ERROR: .npmrc missing registry pin" && exit 1)

  test-contracts:
    # [CHORE-TEST-CONTRACTS-REAL-GATE] continue-on-error REMOVED: the suite is now
    # green (OrderExecutor 68/68 + FeeCollector 19/19), so a red contract suite MUST
    # fail the PR — this is a real regression gate again, not advisory noise.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@8789b3e21e6c11b2697f5eb56eddae542f746c10 # v1
        with:
          version: stable
      - name: Run forge tests — OrderExecutor (order-engine)
        working-directory: contracts/order-engine
        run: forge test -vvv
      - name: Run forge tests — FeeCollector (fund-flow)
        # Scoped to the FeeCollector suite: the contracts/ project (src = ".") also
        # globs order-engine/test, so --match-path avoids re-running it here.
        working-directory: contracts
        run: forge test --match-path 'test/*.t.sol' -vvv

  build:
    needs: [lint, typecheck, audit, lockfile-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --ignore-scripts=false
      - run: npm run build
