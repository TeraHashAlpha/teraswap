# CI pipeline — parallel jobs: lint, typecheck, audit, contract tests
# Build runs after lint + typecheck + audit + lockfile-lint pass.
# Contract tests run independently (Foundry/Forge).
#
# ── SECURITY NOTE (CHORE-REVERT-IGNORE-SCRIPTS) ───────────────────────
# `npm ci` honours the repo-root .npmrc `ignore-scripts=true` — install
# lifecycle scripts (preinstall/install/postinstall) do NOT run. This was
# previously overridden with `--ignore-scripts=false`, justified by a
# Prisma `postinstall` that does not actually exist (0 occurrences in
# package-lock.json; no `prisma` dependency, no postinstall script in
# package.json). Reverted (threat model P5d / AZ review) to close the
# unnecessary supply-chain surface.
#
# If a future dependency genuinely needs an install script, do NOT
# blanket-revert this — scope `npm_config_ignore_scripts=false` (or an
# npm `--foreground-scripts`/per-package override) to just that install
# step and document why in FEEDBACK.
# ─────────────────────────────────────────────────────────────────────

name: "CI"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Lint (warnings only — React Compiler rules are advisory)
        run: npx next lint --max-warnings 200 || true

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      # [INC-2026-05-31-001] Fail on any NEW circular import — a cycle can yield
      # undefined exports in the Next prod bundle that unit tests don't catch.
      - name: Circular-import guard
        run: npm run check:circular

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Security audit (high/critical, allowlist-aware)
        # Fails on any high/critical NOT in audit-allowlist.json. The allowlist holds
        # only fixes blocked by .npmrc min-release-age=7 (each with a dated TODO). See
        # scripts/audit-gate.mjs + audit-allowlist.json.
        run: node scripts/audit-gate.mjs

  catalog-address-guard:
    # [CHORE-CATALOG-ADDRESS-GUARD] Deterministic gate over the curated token catalog
    # (src/lib/tokens.ts + src/lib/chains/tokens.ts, chains 1 + 8453). Every token must
    # have on-chain bytecode (no dead addresses like the W/USDe/weETH removed this sprint),
    # be present in a bundled reputable token list (or be allowlisted), and have a unique
    # symbol per chain (no legacy+current duplicates like MORPHO). Reads a committed verdict
    # cache (src/lib/chains/catalog-guard.trust.json) refreshed by scripts/refresh-catalog-guard.ts
    # — NO network at gate time, so it is reproducible and never flaky.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Catalog address guard
        run: npx vitest run src/lib/chains/catalog-address-guard.test.ts

  fee-usd-guard:
    # [chore/swap-fee-usd-fix] Gate the platform-fee USD valuation. The full vitest
    # suite is not run in CI (only single-file guards), so this pins the regression:
    # a non-oracle fee token (e.g. AERO) must be valued from the reliably-priced side
    # (~$0.002), never the fee amount × the other leg's ETH price (~$5.79).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Platform-fee USD guard
        run: npx vitest run src/lib/fee-usd.test.ts src/components/QuoteBreakdown.test.tsx

  stablecoin-constant-guard:
    # [CHORE-STABLECOIN-CONSTANT] Gate the chain-keyed stablecoin single source of truth
    # (AZ review FE5: 6 divergent inline lists — USDbC counted as ~$1 in one gate but not
    # another). The full vitest suite is not run in CI (only single-file guards), so this
    # pins: the canonical per-chain USD (~$1) membership + its catalog drift-guards, EURC
    # (EUR-pegged) staying category-only, every historical call site resolving to the
    # constant, and the chain-keyed auto-slippage behaviour.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Stablecoin constant guard
        run: npx vitest run src/lib/chains/stablecoins.test.ts src/components/SlippageModal.test.tsx

  oracle-value-guard:
    # [CHORE-ORACLE-VALUE-FAILCLOSED] Gate the fail-closed >$10k trade-value estimate
    # (threat model PR #277, P2 MED confirmed): value = max(inputUsd, outputUsd) across
    # DefiLlama + the server Chainlink path; a trade neither source can price on either
    # side must BLOCK (422 `unpriceable`), never pass as "$0". The full vitest suite is
    # not run in CI (only single-file guards), so this pins the server route branch and
    # the client estimate helper.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Oracle value fail-closed guard
        run: npx vitest run src/app/api/swap/route.test.ts src/lib/swap-usd-estimate.test.ts

  quote-source-guard:
    # [CHORE-QUOTE-SOURCE-FIXES] The full vitest suite is not run in CI (only
    # single-file guards), so this pins the displayed-quote source hygiene:
    # (C1) the OpenOcean v4 API takes the sell amount in HUMAN units and
    # answers in RAW base units — the adapter must convert the request (never
    # send raw base units → 10^decimals-oversized garbage quotes) and pass the
    # response through unconverted; (C2) Balancer stays in DISABLED_SOURCES
    # (its SOR order endpoint is 404-dead) and is excluded from the quote
    # fan-out before it runs. Regression origin: T-SAF W7-L-02 coverage check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Quote-source guard (OpenOcean units; Balancer disabled; Sushi v7 sender + executable scoping; split sub-quote chainId)
        run: npx vitest run src/lib/adapters/openocean.test.ts src/lib/adapters/balancer-disabled.test.ts src/lib/adapters/sushiswap.test.ts src/lib/executable-sources.test.ts src/hooks/useSplitRoute.test.ts

  dca-resilience-guard:
    # [chore/dca-resilience] The full vitest suite is not run in CI (only single-file
    # guards), so this pins the DCA-resilience UI regressions: (1) failedOrderReason
    # maps the keeper's SPECIFIC terminal reason codes (expired / no_route_after_retries
    # / insufficient_balance / insufficient_allowance / nonce_invalid / cancelled) to
    # human messages instead of the generic "swap route unavailable"; (2) the DCA create
    # form blocks a schedule that can't finish before expiry (interval × buys > expiry).
    # The keeper-side policy (retry-policy.test.mjs) is gated by keeper-tests.yml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: DCA resilience guard (failure reasons + creation guard)
        run: npx vitest run src/lib/order-engine/failed-reason.test.ts src/lib/order-engine/dca-creation-guard.test.ts src/components/DCAPanel.routability.test.tsx

  oracle-advisory-guard:
    # [chore/oracle-less-advisory] Pins the oracle-coverage detection behind the
    # creation-time "no price oracle" note: resolveOracleCoverage (note ONLY when
    # no Chainlink feed AND DefiLlama definitively has no price; a failed probe
    # fails open) + checkOracleCoverage's fail-open client policy. The DCAPanel
    # render wiring is covered by dca-resilience-guard (DCAPanel.routability.test.tsx).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Oracle-less advisory guard (detection + fail-open)
        run: npx vitest run src/lib/order-engine/oracle-coverage.test.ts src/lib/order-engine/check-oracle.test.ts

  token-catalog-pipeline-guard:
    # [CHORE-TOKEN-CATALOG-PIPELINE] The full vitest suite is not run in CI (only
    # single-file guards), so this gates the catalog build pipeline: merge keyed by
    # (chainId, EIP-55 address), >=2-source agreement (>=3 low-liquidity), symbol-conflict
    # rejection, guard-PASS gating (the EXISTING catalog guard, reused), core allowlist
    # force-include under total source outage, outage-tolerant build — PLUS the invariants
    # of the COMMITTED generated catalogs (schema, EIP-55, cores present+verified, no
    # duplicate address/symbol, verified⇒sources, CSP-safe 'self' logo URLs) and the
    # pinned per-chain majors. NO network — pure logic + committed JSON.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Token-catalog pipeline guard (cross-verify logic + committed catalog invariants)
        run: npx vitest run scripts/token-catalog/lib/verify.test.ts scripts/token-catalog/lib/guard-gate.test.ts scripts/token-catalog/lib/build-chain.test.ts scripts/token-catalog/lib/sources.test.ts scripts/token-catalog/lib/category.test.ts src/lib/chains/token-catalog-json.test.ts src/lib/chains/token-catalog.test.ts src/lib/chains/tokens.test.ts

  minimum-output-guard:
    # [AUDIT-W2 / W2-L-01] The full vitest suite is not run in CI (only single-file
    # guards), so this pins the unusable-quote refusal: a malformed/zero quote
    # toAmount on a fee-routed swap or split leg REFUSES the swap (UnusableQuoteError
    # from src/lib/minimum-output.ts) instead of silently encoding minimumOutput=0 —
    # which would disable the FeeCollector's on-chain InsufficientOutput floor
    # (see docs/security/DEPLOYED-SOURCES.md). Also pins the valid-quote floor and
    # the split-leg skip semantics.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Minimum-output guard (unusable quote → refusal, never minOutput 0)
        run: npx vitest run src/lib/minimum-output.test.ts src/lib/swap-simulation.test.ts src/hooks/__tests__/swap-validations.test.ts src/hooks/useSplitSwap.test.ts

  quote-quorum-guard:
    # [CHORE-QUOTE-QUORUM / W7-L-02] The full vitest suite is not run in CI (only
    # single-file guards), so this pins the low-quorum display sanity: with <3
    # responders the 3×-median outlier filter is inert (n=2 ⇒ threshold =
    # 1.5×max), so a 10^n-mis-scaled quote (the OpenOcean units class) could win
    # the DISPLAYED best price. applyLowQuorumSanity bounds the winner to the
    # runner-up (500 bps default, LOW_QUORUM_MAX_DEVIATION_BPS override) and
    # demotes a winner beyond the band. Display-only — execution gates untouched.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Quote-quorum guard (garbage quote cannot win a 2-responder display)
        run: npx vitest run src/lib/quote-quorum.test.ts

  source-health-guard:
    # [CHORE-QUOTE-QUORUM / W7-L-02] The full vitest suite is not run in CI (only
    # single-file guards), so this pins the source-health alerting: a baselined
    # (historically-quoting) source going silent, a systematic display-outlier
    # counter crossing threshold, or a win-rate collapse fires EXACTLY ONE
    # rate-limited informational alert per source·kind per window through the
    # emitTransitionAlert fan-out; KV failures fail OPEN (monitoring never breaks
    # the monitor). Balancer/OpenOcean/Odos died invisibly before this existed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Source-health guard (silence/outlier/drift pages once per window)
        run: npx vitest run src/lib/source-health-monitor.test.ts

  deployed-sources-guard:
    # [AUDIT-W2 / W2-M-01] Static deployed-source-of-truth gate: the canonical
    # addr → source → compiler → code-hash map (docs/security/DEPLOYED-SOURCES.md)
    # must exist and stay consistent, the stale never-deployed FeeCollector flat
    # must keep its DEPRECATED name + banner and must never be referenced by code
    # or listed as a deployed source. [CHORE-AZ-SECURITY-BATCH C4] Also: the weak
    # V1 flat (frozen on-chain; 1-arg ctor, no admin/whitelist/timelock/
    # minimumOutput, open receive) must keep its ⛔ DO-NOT-DEPLOY banner and stay
    # out of code, and contracts/DEPLOY.md must keep prescribing the canonical V2
    # recipe (TeraSwapFeeCollector.sol, solc 0.8.28, via-IR, 2-arg ctor).
    # Dependency-free and offline (no npm ci); the on-chain half is
    # scripts/verify-deployed-sources.mjs (manual/audit runs).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - name: Deployed-sources guard (map + deprecated/V1 flats + DEPLOY.md recipe)
        run: node scripts/check-deployed-sources.mjs

  api-hardening-guard:
    # [AUDIT-W6] The full vitest suite is not run in CI (only single-file
    # guards), so this pins the Wave-6 API hardening: (W6-M-01) reading a
    # wallet's ACTIVE/PENDING conditional-order strategy requires the
    # per-session read signature — 401 READ_AUTH_REQUIRED without it, terminal
    # statuses stay public, the hook signs once per session and retries;
    # (W6-M-02) log-* + POST /api/orders are per-IP rate-limited before any
    # Supabase work — 429; (W6-L-01) every body route refuses oversized
    # payloads via the shared bodySizeGuard — 413. log-swap's insert-shape
    # suite rides along because that route now runs the ingestion guards.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: API hardening guard (read gate 401 / rate limit 429 / body cap 413)
        run: npx vitest run src/lib/order-engine/read-auth.test.ts src/lib/order-engine/types.test.ts src/lib/body-limit.test.ts src/app/api/orders src/app/api/log-routes.hardening.test.ts src/app/api/log-swap/route.test.ts src/hooks/useOrderEngine.test.ts src/components/OrderDashboard.test.tsx

  dca-visibility-guard:
    # [CHORE-DCA-VISIBILITY-AND-STATS] The full vitest suite is not run in CI (only
    # single-file guards), so this pins the DCA visibility surface:
    #   #2 /api/history merges the wallet's CONFIRMED order_executions fills with the
    #      swaps table (swaps-first tx_hash dedup, reused from /api/analytics) and the
    #      fills are W6-gated — surfaced ONLY with a valid per-session read signature,
    #      never another wallet's, never an active DCA's running strategy.
    #   #3 src/lib/dca/position-stats.ts computes cost-basis / invested / received /
    #      %-complete / P&L-vs-spot purely from the fills; the golden completed DCA
    #      0x5449dea0 (WETH→ETHFI, 5/5) reconciles exactly, P&L uses a live price.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: DCA visibility guard (history union + W6 gate + position stats)
        run: npx vitest run src/app/api/history/route.test.ts src/lib/dca/position-stats.test.ts

  lockfile-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"
      - name: Validate lockfile integrity
        run: npx lockfile-lint@4 --path package-lock.json --type npm --allowed-hosts npm --validate-https --validate-integrity
      - name: Verify .npmrc hardening
        run: |
          grep -q 'min-release-age' .npmrc || (echo "ERROR: .npmrc missing min-release-age" && exit 1)
          grep -q 'registry=https://registry.npmjs.org/' .npmrc || (echo "ERROR: .npmrc missing registry pin" && exit 1)

  test-contracts:
    # [CHORE-TEST-CONTRACTS-REAL-GATE] continue-on-error REMOVED: the suite is now
    # green (OrderExecutor 68/68 + FeeCollector 19/19), so a red contract suite MUST
    # fail the PR — this is a real regression gate again, not advisory noise.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@8789b3e21e6c11b2697f5eb56eddae542f746c10 # v1
        with:
          version: stable
      - name: Run forge tests — OrderExecutor (order-engine)
        working-directory: contracts/order-engine
        run: forge test -vvv
      - name: Run forge tests — FeeCollector (fund-flow)
        # Scoped to the FeeCollector suite: the contracts/ project (src = ".") also
        # globs order-engine/test, so --match-path avoids re-running it here.
        working-directory: contracts
        run: forge test --match-path 'test/*.t.sol' -vvv

  build:
    needs: [lint, typecheck, audit, lockfile-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build
