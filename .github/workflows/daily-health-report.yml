# [CHORE-DAILY-HEALTH-REPORT-GHA] Scheduled daily production health report.
#
# WHY: the health-report generator ran as an owner-level sandboxed scheduled task with NO SSH
# signing key configured. Every run's PERSIST step ("node scripts/commit-audit-report.mjs")
# therefore failed with "fatal: either user.signingkey or gpg.ssh.defaultKeyCommand needs to be
# configured" — ~20 reports were generated on disk and never committed (see the "Erro na
# persistência" section of any recent Audits/Daily/health-*.md). It also checked local env vars
# (MONITOR_SECRET, SUPABASE_SERVICE_ROLE_KEY) that are simply unset in that sandbox, producing a
# permanent false "unreachable/unconfigured" warning even though production is fine.
#
# This workflow replaces BOTH: it runs on GitHub's infrastructure (no local signing key needed —
# see the PERSIST step below for exactly why that lets it push without one), and it checks
# PRODUCTION directly (via the live site + the public /api/health self-report), which closes the
# local-env check-gap by construction: a real misconfiguration in prod shows up as a real FAIL,
# not as this workflow's own env being unset.
#
# PERSIST STEP DESIGN: this does NOT commit to `main` and does NOT open a PR. `main` requires
# signed commits at branch protection (CLAUDE.md rule #12) and a plain `git commit` from an
# Actions runner is not cryptographically signed — it would be rejected the same way the sandbox
# was blocked, just server-side instead of client-side. Reports already have a dedicated home that
# does not enforce that: the `audits/cadence` branch (see scripts/commit-audit-report.mjs, which
# pushes there via a temp detached worktree so a report commit never touches whatever branch the
# operator has checked out). This workflow mirrors that same temp-worktree approach, so
# `audits/cadence` keeps behaving exactly as it does for every OTHER cadence report, regardless of
# whether it was written by this Action or by an operator running the script by hand. No PR, no
# Auditor gate — see the PR body for this chore for the Auditor note (CI/infra, not fund-flow).
#
# SECRETS THIS WORKFLOW NEEDS (Settings → Secrets and variables → Actions → New repository
# secret). Exact names, read only via `env:` and never interpolated into a `run:` string or
# echoed/set -x'd — GitHub auto-masks a registered secret's value in logs ONLY when it reaches the
# log through a real value, so the discipline of never printing it is what actually protects it:
#   MONITOR_SECRET           -- same value as the MONITOR_SECRET Vercel prod env var. Sent as
#                                `Authorization: Bearer` to GET /api/monitor.
#   HEALTH_RPC_URL_BASE      -- a Base mainnet JSON-RPC URL, used ONLY for a read-only
#                                eth_getBalance call. Deliberately a SEPARATE secret from any RPC
#                                URL the app or keeper use in production — this workflow does not
#                                need write/signing access and should never share a key with
#                                something that does.
#   KEEPER_ADDRESS_BASE      -- the Base keeper wallet's address (public on-chain — not sensitive,
#                                but kept alongside the other two as a repo secret for one-place
#                                ops config; swap to a repo VARIABLE later if that split is
#                                preferred).
#   HEALTH_RPC_URL_ARBITRUM  -- [Auditor M2 / PR #497] Arbitrum One JSON-RPC URL, same read-only
#                                contract as HEALTH_RPC_URL_BASE. OPTIONAL — leaving it unset keeps
#                                Arbitrum "not monitored" (explicit in the report, never silent),
#                                which is correct until the Arbitrum keeper is actually polling
#                                (docs/DEPLOYMENTS.md § Keeper registry).
#   KEEPER_ADDRESS_ARBITRUM  -- [Auditor M2 / PR #497] the Arbitrum keeper wallet's address, same
#                                sensitivity/rationale as KEEPER_ADDRESS_BASE. OPTIONAL for the
#                                same reason as HEALTH_RPC_URL_ARBITRUM. Set both together — one
#                                without the other is treated as unset (see check_one_chain below).
#
# Triggers are schedule/workflow_dispatch only — no untrusted input is ever interpolated into a
# run: command (the ${{ }}-in-run injection class the security-guidance hook warns about does not
# apply here: nothing in this workflow reads PR titles, issue bodies, or any other attacker-editable
# GitHub event field).

name: "Daily health report"

on:
  schedule:
    - cron: "0 8 * * *" # 08:00 UTC daily — adjust to the owner's preferred reporting hour
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-health-report
  cancel-in-progress: false

env:
  SITE_URL: "https://www.teraswap.app"
  # Thresholds mirror the convention already established in recent Audits/Daily/health-*.md
  # reports (e.g. health-2026-07-24.md: "abaixo do threshold de aviso 0.01 ETH; acima do crítico
  # 0.002 ETH"). NOT derived from freeze-score.js's GAS_LOW_USD/GAS_CRITICAL_USD — those are
  # USD-denominated inputs to the keeper's own auto-freeze urgency SCORE (a different signal, for
  # a different consumer); these are ETH-denominated and specific to this human-facing report.
  GAS_WARNING_ETH_BASE: "0.01"
  GAS_CRITICAL_ETH_BASE: "0.002"
  # [Auditor M2 / PR #497] Arbitrum has no real-fill gas calibration yet
  # (docs/feedback/sprint-keeper-multichain-arbitrum.md — "PENDING real-fill calibration"). Derived
  # as 1/5 of Base's threshold: the keeper's own Arbitrum gas tiers (gas-tier.js) set a NORMAL
  # priority fee of 0.001 gwei vs Base's ~0.02 gwei ceiling (Nitro's FCFS sequencer needs near-zero
  # tips) and Nitro's L1-calldata compression keeps the data-posting component small too — a
  # conservative 5x (not the full ~20x priority-fee ratio) is used so this doesn't need to track
  # the keeper's tier calibration exactly. Mirrored in src/lib/keeper-health-monitor.ts — keep both
  # in sync if either changes. Revisit once real Arbitrum fills give a measured $/fill like Base's.
  GAS_WARNING_ETH_ARBITRUM: "0.002"
  GAS_CRITICAL_ETH_ARBITRUM: "0.0004"

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history — the Git Activity check needs `git log --since`

      - name: Compute report date
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Check site + API + SSL (public, unauthenticated)
        id: site
        run: |
          set -euo pipefail

          site_out=$(curl -s -o /dev/null -w "%{http_code} %{time_total}" --max-time 15 "$SITE_URL" || echo "000 0")
          echo "site_code=$(echo "$site_out" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "site_time=$(echo "$site_out" | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

          api_out=$(curl -s -o /dev/null -w "%{http_code} %{time_total}" --max-time 15 "$SITE_URL/api/health" || echo "000 0")
          echo "api_code=$(echo "$api_out" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "api_time=$(echo "$api_out" | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
          # /api/health's public branch returns 200 (status:"OK") when isSupabaseEnabled() is true
          # in PRODUCTION, 503 (status:"DEGRADED") otherwise — this IS the prod secret-set status
          # this workflow reports, and it is real prod state, not this runner's own (unset) env.

          host=$(echo "$SITE_URL" | sed -E 's#https?://##; s#/.*##')
          end_date=$(echo | timeout 10 openssl s_client -servername "$host" -connect "$host:443" 2>/dev/null \
            | openssl x509 -noout -enddate 2>/dev/null | sed 's/notAfter=//' || echo "")
          if [ -n "$end_date" ]; then
            end_epoch=$(date -u -d "$end_date" +%s 2>/dev/null || echo 0)
            now_epoch=$(date -u +%s)
            days_left=$(( (end_epoch - now_epoch) / 86400 ))
            echo "ssl_end=$end_date" >> "$GITHUB_OUTPUT"
            echo "ssl_days=$days_left" >> "$GITHUB_OUTPUT"
          else
            echo "ssl_end=" >> "$GITHUB_OUTPUT"
            echo "ssl_days=" >> "$GITHUB_OUTPUT"
          fi

      - name: Check protected monitor endpoint
        id: monitor
        env:
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${MONITOR_SECRET:-}" ]; then
            echo "code=NOSECRET" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            -H "Authorization: Bearer ${MONITOR_SECRET}" \
            "$SITE_URL/api/monitor" || echo "000")
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Check keeper gas balance (per chain)
        id: gas
        # [Auditor M2 / PR #497] ONE check body (check_one_chain), iterated over CHAINS below —
        # never a second copy of the Base step with 42161 pasted in. Mirrors the per-chain table
        # in src/lib/keeper-health-monitor.ts (KEEPER_CHAINS). Add a chain to CHAINS only once its
        # keeper registry row exists (docs/DEPLOYMENTS.md § Keeper registry).
        env:
          HEALTH_RPC_URL_BASE: ${{ secrets.HEALTH_RPC_URL_BASE }}
          KEEPER_ADDRESS_BASE: ${{ secrets.KEEPER_ADDRESS_BASE }}
          HEALTH_RPC_URL_ARBITRUM: ${{ secrets.HEALTH_RPC_URL_ARBITRUM }}
          KEEPER_ADDRESS_ARBITRUM: ${{ secrets.KEEPER_ADDRESS_ARBITRUM }}
          WARN_BASE: ${{ env.GAS_WARNING_ETH_BASE }}
          CRIT_BASE: ${{ env.GAS_CRITICAL_ETH_BASE }}
          WARN_ARBITRUM: ${{ env.GAS_WARNING_ETH_ARBITRUM }}
          CRIT_ARBITRUM: ${{ env.GAS_CRITICAL_ETH_ARBITRUM }}
        run: |
          set -euo pipefail

          # "chainId:NAME" — NAME suffixes the per-chain env vars above (bash indirect expansion).
          CHAINS="8453:BASE 42161:ARBITRUM"

          # A chain with its address/RPC var unset is NOT MONITORED — reported as such explicitly
          # (never silently skipped, never silently treated as healthy). Emits one pipe-delimited
          # line per chain: chainId|STATUS|ethBalance|warnThreshold|critThreshold
          check_one_chain() {
            chain_id="$1"
            name="$2"
            rpc_var="HEALTH_RPC_URL_${name}"
            addr_var="KEEPER_ADDRESS_${name}"
            warn_var="WARN_${name}"
            crit_var="CRIT_${name}"
            rpc_url="${!rpc_var:-}"
            keeper_address="${!addr_var:-}"
            warn="${!warn_var}"
            crit="${!crit_var}"

            if [ -z "$rpc_url" ] || [ -z "$keeper_address" ]; then
              echo "${chain_id}|NOTMONITORED||${warn}|${crit}"
              return
            fi

            # eth_getBalance is a read-only RPC call — no key, no signing, nothing sent on-chain.
            resp=$(curl -s --max-time 15 -X POST "$rpc_url" \
              -H "Content-Type: application/json" \
              -d "{\"jsonrpc\":\"2.0\",\"method\":\"eth_getBalance\",\"params\":[\"${keeper_address}\",\"latest\"],\"id\":1}" \
              || echo "")
            hex=$(node -e "try{const r=JSON.parse(process.argv[1]);process.stdout.write(r.result||'')}catch{process.stdout.write('')}" "$resp")
            if [ -z "$hex" ]; then
              echo "${chain_id}|RPCFAIL||${warn}|${crit}"
              return
            fi
            eth=$(node -e "
              const wei = BigInt(process.argv[1]);
              const whole = wei / 1000000000000000000n;
              const frac = (wei % 1000000000000000000n).toString().padStart(18, '0').slice(0, 6);
              process.stdout.write(\`\${whole}.\${frac}\`);
            " "$hex")
            echo "${chain_id}|OK|${eth}|${warn}|${crit}"
          }

          out=""
          for entry in $CHAINS; do
            chain_id="${entry%%:*}"
            name="${entry##*:}"
            out="${out}$(check_one_chain "$chain_id" "$name")"$'\n'
          done

          # Multiline GITHUB_OUTPUT needs the heredoc delimiter form (a single-line value can't
          # hold embedded newlines).
          {
            echo "chains<<KEEPER_CHAINS_EOF"
            printf '%s' "$out"
            echo "KEEPER_CHAINS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Git activity (last 24h on origin/main)
        id: git
        run: |
          count=$(git log origin/main --since="24 hours ago" --oneline | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Compose report
        id: compose
        # [correctness] Overall-status classification originally lived in a bash `A || B || C && D`
        # one-liner. Bash's AND-OR list is a strict left-to-right short-circuit CHAIN, not
        # `(A||B||C) && D` — e.g. with A=true (site down) and D=false (gas not critical), the chain
        # still evaluates D last and reports OK, silently swallowing the site-down CRITICAL. Doing
        # this in Node instead gets normal boolean semantics for free and is far easier to read.
        env:
          REPORT_DATE: ${{ steps.date.outputs.date }}
          SITE_CODE: ${{ steps.site.outputs.site_code }}
          SITE_TIME: ${{ steps.site.outputs.site_time }}
          API_CODE: ${{ steps.site.outputs.api_code }}
          API_TIME: ${{ steps.site.outputs.api_time }}
          SSL_END: ${{ steps.site.outputs.ssl_end }}
          SSL_DAYS: ${{ steps.site.outputs.ssl_days }}
          MONITOR_CODE: ${{ steps.monitor.outputs.code }}
          GAS_CHAINS: ${{ steps.gas.outputs.chains }}
          GIT_COUNT: ${{ steps.git.outputs.count }}
        run: |
          set -euo pipefail
          cat > /tmp/compose-report.mjs <<'NODE_EOF'
          import { writeFileSync } from 'node:fs'

          const e = process.env
          const lines = []
          const requiresAttention = []
          let severity = 0 // 0=ok 1=warning 2=critical
          const bump = (n) => { if (n > severity) severity = n }

          const siteOk = e.SITE_CODE === '200'
          bump(siteOk ? 0 : 2)

          const apiOk = e.API_CODE === '200'
          bump(apiOk ? 0 : 2)

          const sslDays = e.SSL_DAYS ? Number(e.SSL_DAYS) : null
          const sslKnown = sslDays !== null && Number.isFinite(sslDays)
          const sslOk = sslKnown && sslDays > 14
          bump(sslKnown ? (sslOk ? 0 : 1) : 1)

          let monitorLine = '⚠️ | Skipped — MONITOR_SECRET repo secret not set'
          if (e.MONITOR_CODE === '200') {
            monitorLine = '✅ | HTTP 200'
          } else if (e.MONITOR_CODE && e.MONITOR_CODE !== 'NOSECRET') {
            monitorLine = `⚠️ | HTTP ${e.MONITOR_CODE}`
            bump(1)
          } else if (e.MONITOR_CODE !== 'NOSECRET') {
            bump(1) // empty/unset code from a failed curl, not the deliberate NOSECRET skip
          }

          // ── [Auditor M2 / PR #497] Per-chain keeper gas — one block per row in
          // GAS_CHAINS ("chainId|STATUS|eth|warn|crit" lines from the gas step's check_one_chain).
          // A chain is "not monitored" (its own explicit status — never silently dropped, never
          // silently folded into "healthy") when its secrets are unset; that is NOT the same as a
          // healthy/degraded/critical chain and must never be conflated with either.
          const CHAIN_NAMES = { '8453': 'Base', '42161': 'Arbitrum One' }
          const chainRows = (e.GAS_CHAINS || '')
            .split('\n')
            .map((l) => l.trim())
            .filter(Boolean)
            .map((l) => {
              const [chainId, status, ethStr, warnStr, critStr] = l.split('|')
              return { chainId, status, eth: ethStr, warnEth: Number(warnStr), critEth: Number(critStr) }
            })

          const gasLines = [] // one "| Keeper gas (<chain>) | ... |" row per chain
          for (const row of chainRows) {
            const chainName = CHAIN_NAMES[row.chainId] || `chain ${row.chainId}`
            const rpcVar = row.chainId === '8453' ? 'HEALTH_RPC_URL_BASE / KEEPER_ADDRESS_BASE' : `HEALTH_RPC_URL_ARBITRUM / KEEPER_ADDRESS_ARBITRUM`

            if (row.status === 'NOTMONITORED') {
              gasLines.push(`| Keeper gas (${chainName}) | ⚠️ | **${row.chainId}: not monitored** — ${rpcVar} repo secrets not set |`)
              requiresAttention.push(`${row.chainId}: not monitored — ${rpcVar} repo secrets are not set, so the ${chainName} keeper gas check is skipped every run.`)
              // Informational (Base's existing default state before this chain has a keeper) —
              // never bumps severity on its own.
              continue
            }
            if (row.status === 'RPCFAIL') {
              gasLines.push(`| Keeper gas (${chainName}) | ⚠️ | RPC call failed |`)
              requiresAttention.push(`The ${chainName} RPC call for the keeper gas balance failed — check the ${rpcVar.split(' / ')[0]} secret is a working endpoint.`)
              bump(1)
              continue
            }
            // OK
            const gasEth = Number(row.eth)
            const belowCrit = gasEth < row.critEth
            const belowWarn = gasEth < row.warnEth
            if (belowCrit) {
              gasLines.push(`| Keeper gas (${chainName}) | 🔴 | ${row.eth} ETH — BELOW critical threshold (${row.critEth} ETH). Keeper may soon be unable to pay gas. |`)
              requiresAttention.push(`Keeper gas on ${chainName} is ${row.eth} ETH — BELOW the ${row.critEth} ETH critical floor. Top up immediately.`)
              bump(2)
            } else if (belowWarn) {
              gasLines.push(`| Keeper gas (${chainName}) | ⚠️ | ${row.eth} ETH — below warning threshold (${row.warnEth} ETH); above critical (${row.critEth} ETH). |`)
              requiresAttention.push(`Keeper gas on ${chainName} is ${row.eth} ETH — below the ${row.warnEth} ETH warning threshold. Top up before it reaches the ${row.critEth} ETH critical floor.`)
              bump(1)
            } else {
              gasLines.push(`| Keeper gas (${chainName}) | ✅ | ${row.eth} ETH |`)
            }
          }

          const overall = severity === 2 ? '🔴 CRITICAL' : severity === 1 ? '🟡 WARNING' : '🟢 OK'

          // Every ⚠️/❌ table row gets a corresponding bullet here — a WARNING/CRITICAL report
          // with an empty "Requires Attention" (because only the NOSECRET/gas-warning/SSL cases
          // were covered) defeats the point of the report: a reader scans this section first.
          if (!siteOk) {
            requiresAttention.push(`Site returned HTTP ${e.SITE_CODE} instead of 200 — teraswap.app may be down or unreachable.`)
          }
          if (!apiOk) {
            requiresAttention.push(`/api/health returned HTTP ${e.API_CODE} instead of 200 — production Supabase env vars may be unset or Supabase itself may be down.`)
          }
          if (e.MONITOR_CODE === 'NOSECRET') {
            requiresAttention.push('MONITOR_SECRET repo secret is not set — the Monitor check is skipped every run. Add it in Settings → Secrets.')
          } else if (e.MONITOR_CODE !== '200') {
            requiresAttention.push(`/api/monitor returned HTTP ${e.MONITOR_CODE || '(no response)'} — check MONITOR_SECRET still matches the Vercel prod env var, or that the endpoint is reachable.`)
          }
          // Keeper-gas requiresAttention bullets are pushed per-chain inside the gasLines loop
          // above (one rule, not a duplicated block per chain).
          if (!sslKnown) {
            requiresAttention.push('Could not read the SSL certificate expiry — verify the site is serving a valid certificate.')
          } else if (sslDays <= 14) {
            requiresAttention.push(`SSL certificate expires in ~${sslDays} days — renew soon.`)
          }

          lines.push(`# TeraSwap Daily Health Report — ${e.REPORT_DATE}`, '')
          lines.push(`**Overall Status:** ${overall}`, '')
          lines.push('_Generated by the `daily-health-report` GitHub Action (checks run against production, not a local sandbox)._', '')
          lines.push('## Results', '')
          lines.push('| Check | Status | Details |', '|-------|--------|---------|')
          lines.push(`| Site (www.teraswap.app) | ${siteOk ? '✅' : '❌'} | HTTP ${e.SITE_CODE}, ${e.SITE_TIME}s |`)
          lines.push(`| API Health (/api/health) | ${apiOk ? '✅' : '❌'} | HTTP ${e.API_CODE}, ${e.API_TIME}s — 200 means prod Supabase env vars ARE set; 503 means they are NOT |`)
          lines.push(
            sslKnown
              ? `| SSL Certificate | ${sslOk ? '✅' : '⚠️'} | Expires ${e.SSL_END} (~${sslDays} days) |`
              : '| SSL Certificate | ⚠️ | Could not read certificate expiry |',
          )
          lines.push(`| Monitor (/api/monitor) | ${monitorLine} |`)
          lines.push(...gasLines) // [Auditor M2 / PR #497] one row per monitored/not-monitored chain
          lines.push(`| Git Activity (origin/main) | ℹ️ | ${e.GIT_COUNT} commits in the last 24h |`, '')
          lines.push('## Actions Taken')
          lines.push('None — this workflow only reads (curl + a read-only eth_getBalance RPC call); it never writes to any endpoint.', '')
          lines.push('## Requires Attention')
          lines.push(...(requiresAttention.length ? requiresAttention.map((s) => `- ${s}`) : ['Nothing outstanding.']))

          writeFileSync(process.env.OUT_PATH, lines.join('\n') + '\n')
          NODE_EOF

          out="/tmp/health-${REPORT_DATE}.md"
          OUT_PATH="$out" node /tmp/compose-report.mjs
          echo "path=$out" >> "$GITHUB_OUTPUT"
          cat "$out"

      - name: Persist report to the audits/cadence branch (no PR — same target as commit-audit-report.mjs)
        env:
          REPORT_DATE: ${{ steps.date.outputs.date }}
          REPORT_PATH: ${{ steps.compose.outputs.path }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          BASE="origin/main"
          if git fetch origin audits/cadence 2>/dev/null; then
            BASE="origin/audits/cadence"
          fi

          # Detached temp worktree, mirroring scripts/commit-audit-report.mjs, so this commit can
          # never pick up unrelated drift between main and audits/cadence — only the one new file.
          WT="$(mktemp -d)"
          git worktree add --detach "$WT" "$BASE"
          trap 'git worktree remove --force "$WT" 2>/dev/null || rm -rf "$WT"' EXIT

          mkdir -p "$WT/Audits/Daily"
          cp "$REPORT_PATH" "$WT/Audits/Daily/health-${REPORT_DATE}-gha.md"

          # `git -C "$WT"` throughout — never `cd` into the worktree — so the trap's cleanup can
          # remove it unconditionally without the shell's own cwd being inside the path it deletes.
          git -C "$WT" add "Audits/Daily/health-${REPORT_DATE}-gha.md"
          if git -C "$WT" diff --cached --quiet; then
            echo "report already on audits/cadence — nothing to commit"
            exit 0
          fi
          git -C "$WT" commit -m "docs(audits): daily health report ${REPORT_DATE} [auto]"
          git -C "$WT" push origin "HEAD:refs/heads/audits/cadence"
