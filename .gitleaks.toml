# [INF-03] Gitleaks configuration for TeraSwap.
# Extends the default ruleset (100+ secret patterns) with a project-
# specific allowlist of paths that legitimately contain "secret-looking"
# tokens we do not want to flag on every PR.

[extend]
useDefault = true

[allowlist]
description = "TeraSwap false-positive allowlist"
paths = [
  '''\.env\.example''',
  '''contracts/order-engine/''',
  # [Sprint 9Y] Vendored Uniswap Labs default token list + the catalog
  # generated from it. Every "secret" here is a PUBLIC ERC-20 contract
  # address (40 hex chars) or logo URL, not a credential — gitleaks'
  # generic-api-key entropy heuristic false-positives on token addresses
  # (e.g. WETH 0xC02a…756Cc2). Scoped to the vendored/generated catalog
  # paths ONLY; all other src/ + scripts/ files remain fully scanned by
  # the default ruleset.
  '''scripts/token-lists/''',
  '''src/lib/chains/token-catalog\.generated\.ts''',
]

# [CHORE-POLISH-4 P1] Bare 64-hex EVM private key — keyword-proximity variant.
# gitleaks' default rules catch *labelled* provider secrets but MISS a bare 0x-prefixed /
# 0x-less 64-hex (32-byte) EVM key. A real key was once pasted into a local, uncommitted runbook
# and slipped past the scanner (the INC-2026-06-09-001 near-miss); we caught it by manual/semantic
# review. This rule closes the tooling gap WITHOUT flooding: a blockchain repo is full of 64-hex
# strings (keccak/tx/block hashes, storage slots, merkle roots), so we never flag bare hex — we
# fire ONLY when a 64-hex value sits immediately next to a private-key KEYWORD with an assignment
# or colon, e.g. `PRIVATE_KEY = 0x..64`, `privKey: "..64"`. Applies to ALL paths incl. docs/,
# Audits/, *.md runbooks (where the near-miss lived). ADDS to the default ruleset only.
[[rules]]
id = "evm-private-key-keyword-proximity"
description = "Bare 64-hex EVM private key next to a private-key keyword (INC-2026-06-09-001 near-miss)"
regex = '''(?i)(private[_-]?key|priv[_-]?key|secret[_-]?key|mnemonic|keystore|\bPK\b)["'\s]{0,8}[:=]\s*["']?(0x)?[0-9a-fA-F]{64}\b'''
keywords = ["private", "privkey", "priv_key", "priv-key", "secret_key", "secret-key", "mnemonic", "keystore", "pk"]

  # Per-rule value-allowlist (NOT a path allowlist) for two KNOWN-PUBLIC 64-hex values this rule
  # surfaces. regexTarget="match" (the keyword+value match, NOT the whole line) so suppression is
  # scoped to exactly these values: a DIFFERENT real key — even co-located on the same line as an
  # allowlisted value — still flags (line-scope would blind it). Scoped to THIS rule only.
  [[rules.allowlists]]
  description = "P1 fixture fake key + published Anvil/Hardhat default account #0 key"
  regexTarget = "match"
  regexes = [
    # The P1 positive proof fixture's FAKE key (scripts/gitleaks-fixtures/positive-*). Allowlisting
    # the exact value keeps the committed fixture from reddening the CI git-history scan.
    '''0xdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef''',
    # Published ANVIL / HARDHAT default account #0 private key (derives to the canonical public
    # 0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266) — a throwaway local-dev key in the E2E fork-test
    # docs (docs/guides/E2E-FORK-TEST.md). NOT a real secret, no rotation needed.
    # ⚠ FLAGGED FOR ARCHITECT REVIEW per CHORE-POLISH-4 (a finding on a committed file); triaged as
    # the public Anvil key (INC-2026-06-09-001 near-miss context) — see FEEDBACK.md.
    '''0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80''',
  ]
