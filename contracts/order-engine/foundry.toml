[profile.default]
src = "."
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
remappings = ["@openzeppelin/=lib/openzeppelin-contracts/"]
via_ir = true
optimizer = true
optimizer_runs = 200
# [P107] OpenZeppelin ships formal-verification harnesses under fv/ that
# import from fv/patched/ — a directory generated by their FV tooling and
# absent from the submodule. Foundry tries to compile them and fails in
# CI. Excluding the directory leaves the production contracts (under
# lib/openzeppelin-contracts/contracts/) untouched.
exclude = ["lib/openzeppelin-contracts/fv"]
