[profile.default]
src = "."
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
remappings = ["@openzeppelin/=lib/openzeppelin-contracts/"]
via_ir = true
optimizer = true
optimizer_runs = 200
# [P107 / CHORE-OZ-SUBMODULE] OpenZeppelin ships its OWN formal-verification
# harnesses under lib/openzeppelin-contracts/fv/harnesses/ that import from
# fv/patched/ — a directory GENERATED by OZ's FV tooling (gitignored, never in
# the submodule checkout). With src = ".", forge globs those harnesses and fails
# to compile them ("Source lib/openzeppelin-contracts/fv/patched/...Ownable.sol
# not found"), which is what reddened test-contracts on every PR.
# `skip` is the recognized glob filter (forge build --skip / config `skip`); the
# previous `exclude` key was silently ignored (forge config showed exclude = []).
# This removes ONLY OZ's FV scaffolding — our production contracts
# (lib/openzeppelin-contracts/contracts/**) and the real test suite (test/**) are
# untouched; we don't run OZ's formal verification.
skip = ["*/fv/**"]
